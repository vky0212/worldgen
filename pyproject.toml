[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "worldgen"
version = "0.1.0"
description = "Geospatial world compiler: real-world regions to game-ready, engine-agnostic 3D worlds"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "WorldGen contributors" }]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "shapely>=2.1",
    "geopandas>=1.0",
    "pyproj>=3.6",
    "rasterio>=1.4",
    "pyarrow>=16",
    "trimesh>=4.4",
    "networkx>=3.3",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
worldgen = "worldgen.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/worldgen"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "worldgen/_profiles"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: test needs internet access (deselect with -m 'not network')",
    "slow: slower end-to-end test",
]

[dependency-groups]
dev = ["pytest>=8"]
